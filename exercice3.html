<html>
   <head>
      <title>Méthode Math.sqrt()</title>
   </head>
      <script>
         function racine() {
            var r = document.getElementById("nb");
            let racine = Math.sqrt(r.value);

         document.write("Racine de " +r.value+ " est: " + racine + "<br />");
         }
      </script>
      <body>
         <INPUT type="text" name="nbr" id="nb" size="4">
             <INPUT type="button" value="Calculer la racine" onclick="racine()">
     
            
     </body>
     
   </body>
</html>
