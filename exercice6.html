<html>

<head>
    <title>Calcul</title>
    <script language="JavaScript">
        function resultat() {
            var a = document.f.zt1.value;
            var b = eval(a);/*La fonction eval() permet d'évaluer du code JavaScript représenté sous forme d'une chaîne de caractères.*/
            document.f.zt2.value = b;
        }
    </script>
</head>

<body>
    <form name="f">
        <input type="text" name="zt1">
        <input type="button" value=" = " onclick="resultat()">
        <input type="text" name="zt2"><br>
        <a href="#" onclick="resultat()">voir</a>
    </form>
</body>

</html>
