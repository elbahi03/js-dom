<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>

<body>

    <script>
        var chiffreSaisi = prompt("Quelle table de multiplication voulez vous afficher ?");



        for (var i = 1; i <= 10; i++) {
            var resultat = chiffreSaisi * i;
            document.write(chiffreSaisi + " * " + i + " = " + resultat+"<br>");
        }
    </script>
</body>

</html>
